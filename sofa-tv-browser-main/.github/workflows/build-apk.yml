name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Platform 36 and build-tools 36.1.0, as app/build.gradle.kts asks for.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key, so every build installs over the previous one.
      # Without these secrets the APK is signed with a throwaway debug key and
      # Android will make you uninstall the old copy before installing a new one.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SOFA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sofa.keystore"
            echo "SOFA_KEYSTORE_FILE=$RUNNER_TEMP/sofa.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SOFA_KEYSTORE_BASE64 secret: signing with a debug key (updates won't install over older builds)."
          fi

      - name: Build
        env:
          SOFA_KEYSTORE_PASSWORD: ${{ secrets.SOFA_KEYSTORE_PASSWORD }}
          SOFA_KEY_ALIAS: ${{ secrets.SOFA_KEY_ALIAS }}
          SOFA_KEY_PASSWORD: ${{ secrets.SOFA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStandardRelease

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/*.apk "dist/sofa-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sofa-apk
          path: dist/*.apk
          if-no-files-found: error
